name: Feature request
description: Suggest something Certifier should do
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    attributes:
      label: What you'd like
      description: How you picture it working.
  - type: textarea
    attributes:
      label: Alternatives
      description: Other ways around the problem you've considered.
