name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened
      description: What went wrong, including any error message.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Log in as an issuer
        2. ...
    validations:
      required: true
  - type: textarea
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    attributes:
      label: Version
      description: The commit or date of `main` you're running.
  - type: dropdown
    attributes:
      label: Where
      options:
        - Local development (docker compose)
        - Local development (manual setup)
        - Self-hosted deployment
    validations:
      required: true
  - type: textarea
    attributes:
      label: Anything else
      description: Logs, screenshots, browser. Please remove personal data and keys first.
