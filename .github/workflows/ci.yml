name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun test
      # Also the type check: next build generates the route types (PageProps) and runs tsc,
      # which a plain `tsc --noEmit` can't do on a fresh checkout.
      - name: Build
        run: bun run build

  # Every commit in a pull request needs a DCO sign-off from its author (CONTRIBUTING.md); bot commits are exempt.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author=$(git show -s --format='%ae' "$c")
            # Bots (Dependabot and co.) sign off with a different address than they author with.
            case "$author" in *"[bot]@users.noreply.github.com") continue ;; esac
            if ! git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$c" | grep -qiF "<$author>"; then
              echo "::error::$(git show -s --format='%h %s' "$c"): no Signed-off-by for $author. Sign off with git commit -s (see CONTRIBUTING.md)."
              status=1
            fi
          done
          exit $status
